[project]
name = "bot-trader"
version = "0.1.0"
description = "Bot trader: analiza tendencias, probabilidades y noticias; sugiere o ejecuta operaciones en eToro"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "tomli>=2.0; python_version < '3.11'",  # lector de TOML para Python 3.10
]

[project.optional-dependencies]
# Lectura de noticias con Claude (opcional: sin esto se usa un análisis por palabras clave)
ia = ["anthropic>=2.0"]
dev = ["pytest>=8", "anthropic>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot_trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
