# Configuración del agente trader. Copia este archivo a config/estrategia.toml y ajústalo.
# Las llaves secretas NO van aquí: van en el archivo .env (ver .env.example).
#
# Perfil "sostenible": busca crecer de forma constante con caídas chicas, no la ganancia más
# rápida. Opera poco (decide una vez al día), diversifica, deja correr las ganancias con stop
# móvil y arriesga menos cuando las cosas van mal.

[general]
# Dónde opera:
#   papel = simulación local, sin eToro (empieza aquí)
#   demo  = cuenta demo de eToro, dinero virtual (necesita llaves de eToro de entorno Demo/Virtual)
#   real  = dinero real (necesita además ETORO_CONFIRMO_DINERO_REAL=si en el .env)
cuenta = "papel"
# Qué hace con las señales:
#   autonomo = abre y cierra posiciones solo (el agente)
#   sugerir  = solo propone; tú apruebas con `python -m bot_trader aprobar <número>`
modo = "autonomo"
hora_decision_utc = 21           # decide una vez al día desde esta hora UTC (después del cierre de Wall Street)
referencia = "SPY"               # activo que define si el mercado está alcista, defensivo o en crisis
# De dónde saca los precios: auto (eToro si hay llaves, si no Yahoo) | etoro | yahoo | csv
fuente_precios = "auto"
carpeta_csv = "datos"            # para fuente_precios = "csv": datos/AAPL.csv, ...
intervalo = "OneDay"             # velas diarias: la estrategia está pensada para semanas y meses
velas = 1000                     # eToro da como máximo 1000 velas (~4 años en diario)
capital_papel = 10000            # capital inicial de la cuenta simulada (USD)
costo_por_lado = 0.0015          # spread + deslizamiento estimado por entrada y por salida (0.15 %)
costo_anual_cfd = 0.08           # costo anual de mantener un CFD (ventas en corto y apalancadas). Es un supuesto:
                                 # `verificar-etoro` muestra lo que eToro cobra de verdad; ajústalo con eso
base_de_datos = "trader.db"      # bitácora (relativa a este archivo)
vigencia_sugerencias_horas = 24  # después de esto una sugerencia ya no se puede aprobar
desvio_maximo_precio = 0.015     # al aprobar: si el precio ya corrió más de 1.5 % a favor, no se persigue

[riesgo]
riesgo_por_operacion = 0.0075    # si salta el stop se pierde ~0.75 % del capital (lo sano: 0.5 %-1 %)
max_posiciones = 6
max_por_activo = 0.20            # máximo 20 % del capital en un solo activo
max_exposicion_total = 0.80      # máximo 80 % del capital invertido a la vez
volatilidad_objetivo = 0.12      # tope por posición según su volatilidad: lo más volátil recibe menos
correlacion_maxima = 0.85        # no compra algo que se mueve casi igual que lo que ya tiene
correlacion_alta = 0.70          # si se parece bastante, arriesga la mitad
fraccion_kelly = 0.25            # nunca arriesga más de 1/4 de lo que la ventaja estimada justificaría
reducir_con_drawdown = true      # mientras más cae la cuenta desde su máximo, menos arriesga
multiplicador_defensivo = 0.5    # con mercado bajista arriesga la mitad en lo que se mueve con el mercado
perdida_diaria_maxima = 0.03     # con -3 % en el día no abre nada más hasta mañana
drawdown_maximo = 0.15           # con -15 % desde el máximo el agente se pausa hasta que lo reanudes
detectar_desgaste = true         # se pausa solo si deja de acertar lo que sus probabilidades prometían
operaciones_min_desgaste = 15    # operaciones cerradas necesarias antes de juzgar el desgaste
apalancamiento = 1               # 1 = sin apalancamiento (recomendado)
# --- Ganar también a la baja (ventas en corto) ---
# Apagadas por defecto: en las pruebas no mejoraron el resultado. Antes de encenderlas corre
# `python -m bot_trader backtest --robustez`: la fila "con ventas en corto" muestra qué pasaría.
permitir_cortos = false          # true = también vende en corto cuando la tendencia es bajista (son CFDs)
multiplicador_cortos = 0.5       # un corto arriesga la mitad que una compra (perder en corto no tiene techo)
max_exposicion_cortos = 0.30     # máximo 30 % del capital vendido en corto a la vez
monto_minimo = 50                # no abre posiciones más chicas que esto (USD)
monto_maximo_real = 250          # tope duro por orden en la cuenta real (USD)
capital_maximo_bot = 0           # 0 = usa todo el capital de la cuenta; p. ej. 2000 = el bot solo usa 2000 USD
probabilidad_minima = 0.35       # con stop móvil se gana menos veces pero más: manda la expectativa
expectativa_minima = 0.10        # ganancia esperada mínima, en R (1R = lo arriesgado), ya con costos
muestras_minimas = 30            # casos históricos parecidos mínimos para creerle a la estadística
enfriamiento_horas = 24          # no reentrar a un activo hasta pasadas estas horas desde el cierre

[estrategia]
estilo_salida = "seguimiento"    # seguimiento = stop móvil que deja correr ganancias | objetivo = stop y objetivo fijos
stop_atr = 3.0                   # distancia del stop: 3 veces el movimiento diario típico (ATR)
objetivo_atr = 6.0               # solo con estilo_salida = "objetivo"
horizonte = 120                  # velas máximas al simular cada operación histórica
desacuerdo_maximo = 0.15         # si los dos modelos difieren más que esto, no entra
media_rapida = 50
media_lenta = 200
rsi = 14
atr = 14
peso_noticias = 0.25             # cuánto pesan las noticias (máximo 0.5)
umbral_entrada = 0.25            # puntaje combinado mínimo para entrar (de -1 a 1)
umbral_salida = -0.15            # si el puntaje cae a esto, se cierra la posición
rsi_sobrecompra = 75             # no compra con RSI arriba de esto
rsi_sobreventa = 25              # no vende en corto con RSI abajo de esto

[noticias]
activas = true
usar_ia = true                   # con ANTHROPIC_API_KEY lee las noticias con Claude; si no, palabras clave
modelo = "claude-opus-5-5"
max_titulares = 8
horas = 72                       # solo noticias de los últimos 3 días
idioma = "en"                    # en | es  (en inglés hay mucha más cobertura financiera)
refrescar_horas = 4              # reusa la última lectura de noticias durante 4 h (menos llamadas a Claude)

# Lista de activos: diversificada A PROPÓSITO. Lo sostenible viene de tener cosas que no se
# mueven igual (acciones de EE. UU. y del mundo, oro, bonos, energía, cripto), no de apostar
# todo a lo que más subió. Revisa con `python -m bot_trader verificar-etoro` que eToro los tenga;
# si el símbolo en eToro o en Yahoo es distinto, usa simbolo_etoro / simbolo_yahoo.
